name: Build and Deploy Backend - Ventas

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t innovatech-backend-ventas:${{ github.sha }} \
            ./back-Ventas_SpringBoot/Springboot-API-REST

      - name: Tag image for ECR
        run: |
          docker tag innovatech-backend-ventas:${{ github.sha }} \
            ${{ vars.AWS_ECR_REGISTRY }}/innovatech-backend-ventas:${{ github.sha }}

      - name: Push to ECR
        run: |
          docker push ${{ vars.AWS_ECR_REGISTRY }}/innovatech-backend-ventas:${{ github.sha }}

      - name: Deploy to EC2 Backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "===== Desplegando Backend Ventas ====="
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin ${{ vars.AWS_ECR_REGISTRY }}
            docker pull ${{ vars.AWS_ECR_REGISTRY }}/innovatech-backend-ventas:${{ github.sha }}
            docker stop innovatech-backend-ventas || true
            docker rm innovatech-backend-ventas || true
            docker run -d \
              --name innovatech-backend-ventas \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -e DB_PORT=3306 \
              -e DB_NAME=${{ secrets.DB_NAME_VENTAS }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ${{ vars.AWS_ECR_REGISTRY }}/innovatech-backend-ventas:${{ github.sha }}
            echo "===== Deployment completado ====="
            docker image prune -f