name: Build and Deploy Frontend

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t innovatech-frontend:${{ github.sha }} \
            ./front_despacho

      - name: Tag image for ECR
        run: |
          docker tag innovatech-frontend:${{ github.sha }} \
            ${{ vars.AWS_ECR_REGISTRY }}/innovatech-frontend:${{ github.sha }}

      - name: Push to ECR
        run: |
          docker push ${{ vars.AWS_ECR_REGISTRY }}/innovatech-frontend:${{ github.sha }}

      - name: Deploy to EC2 Frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "===== Desplegando Frontend ====="
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin ${{ vars.AWS_ECR_REGISTRY }}
            docker pull ${{ vars.AWS_ECR_REGISTRY }}/innovatech-frontend:${{ github.sha }}
            docker stop innovatech-frontend || true
            docker rm innovatech-frontend || true
            docker run -d \
              --name innovatech-frontend \
              --restart unless-stopped \
              -p 80:80 \
              ${{ vars.AWS_ECR_REGISTRY }}/innovatech-frontend:${{ github.sha }}
            echo "===== Deployment completado ====="
            docker image prune -f