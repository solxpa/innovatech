server {
    listen 80;
    server_name localhost;

    # Directorio raíz para archivos estáticos
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # Proxy Reverso para APIs del Backend
    # El frontend no conoce las IPs de los backends
    # nginx recibe las requests y las redirige a los servicios internos
    # ============================================

    # API de Ventas (puerto 8080)
    # Ejemplo: GET /api/v1/ventas -> http://backend-ventas:8080/api/v1/ventas
    location /api/v1/ventas {
        proxy_pass http://backend-ventas:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts para evitar que la conexión se cuelgue
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API de Despachos (puerto 8081)
    # Ejemplo: GET /api/v1/despachos -> http://backend-despachos:8081/api/v1/despachos
    location /api/v1/despachos {
        proxy_pass http://backend-despachos:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # SPA Routing - React Router
    # Cualquier ruta que no sea un archivo estático
    # se redirige a index.html (necesario para React Router)
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # Caché para Assets Estáticos
    # Los archivos con extensiones conocidas se cachean por 1 año
    # Esto mejora rendimiento al no pedir archivos constantemente
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Desactivar logs para assets (reduce I/O)
        access_log off;
    }

    # ============================================
    # Headers de Seguridad
    # Protegen contra ataques comunes XSS, clickjacking, etc.
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # Logs de Error
    # Solo errores, no access log para reducir I/O
    # ============================================
    error_log /var/log/nginx/error.log warn;
}